---
# PhantomPulse build of our Postiz fork. Replaces upstream's build-containers.yml, which publishes
# to Postiz's own registry and cannot run here.
#
# Tags pushed to ghcr.io/<owner>/phantom-postiz:
#   sha-<short>      every build — pin production to one of these
#   phantom-main     the latest build of the phantom/main branch
#   latest           same as phantom-main
#   <version>        for a git tag like phantom-v2.25.0-1 → 2.25.0-1
name: "Phantom Image"

on:
  push:
    branches:
      - phantom/main
    tags:
      - 'phantom-v*'
  workflow_dispatch:

concurrency:
  group: phantom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the version comes from the upstream release we are based on.
          fetch-depth: 0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name; ghcr rejects uppercase owners like "Abusadat18".
          images: ghcr.io/${{ github.repository_owner }}/phantom-postiz
          tags: |
            type=sha,prefix=sha-
            type=raw,value=phantom-main,enable=${{ github.ref == 'refs/heads/phantom/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/phantom/main' }}
            type=match,pattern=phantom-v(.*),group=1

      - name: App version
        id: version
        # version.txt is not maintained upstream, so use the nearest upstream release tag.
        run: echo "value=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo dev)-phantom.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
