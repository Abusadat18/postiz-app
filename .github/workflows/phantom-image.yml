---
# PhantomPulse build of our Postiz fork. Replaces upstream's build-containers.yml, which publishes
# to Postiz's own registry and cannot run here.
#
# Tags pushed to ghcr.io/<owner>/phantom-postiz:
#   sha-<short>      every build — pin production to one of these
#   phantom-main     the latest build of the phantom/main branch
#   latest           same as phantom-main
#   <version>        for a git tag like phantom-v2.25.0-1 → 2.25.0-1
name: "Phantom Image"

on:
  push:
    branches:
      - phantom/main
    tags:
      - 'phantom-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level, not workflow-level: a newer push cancels a stale build, never a running deploy.
    concurrency:
      group: phantom-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the version comes from the upstream release we are based on.
          fetch-depth: 0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name; ghcr rejects uppercase owners like "Abusadat18".
          images: ghcr.io/${{ github.repository_owner }}/phantom-postiz
          tags: |
            type=sha,prefix=sha-
            type=raw,value=phantom-main,enable=${{ github.ref == 'refs/heads/phantom/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/phantom/main' }}
            type=match,pattern=phantom-v(.*),group=1

      - name: App version
        id: version
        # version.txt is not maintained upstream, so use the nearest upstream release tag.
        run: echo "value=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo dev)-phantom.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    needs: build
    if: github.ref == 'refs/heads/phantom/main'
    runs-on: ubuntu-latest
    # This token is sent to the VPS for the image pull, so give it nothing more.
    permissions:
      packages: read
    concurrency:
      group: deploy-postiz
      cancel-in-progress: false
    steps:
      - name: Image tag
        id: tag
        # Same sha-<short> tag that metadata-action pushed in the build job.
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy Postiz to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          PHANTOM_POSTIZ_TAG: ${{ steps.tag.outputs.value }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,PHANTOM_POSTIZ_TAG
          command_timeout: 20m
          script: |
            set -e
            # Compose lives in its own repo (Abusadat18/Postiz-Setup). .env is untracked, so the
            # reset leaves it alone; the exported PHANTOM_POSTIZ_TAG overrides any pin in it.
            cd /opt/Postiz-Setup
            git fetch origin
            git reset --hard origin/main

            # The other compose files in that repo are experiments; only this one is deployed.
            export COMPOSE_FILE=docker-compose.prod.full.yaml

            # The job token expires with the job, so keep it out of ~/.docker/config.json.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose config --quiet
            docker compose pull postiz
            docker compose up -d --no-deps postiz

            # start_period is 120s and the check runs every 30s, so allow 8 minutes.
            for i in $(seq 1 96); do
              status=$(docker inspect -f '{{.State.Health.Status}}' postiz 2>/dev/null || echo missing)
              [ "$status" = healthy ] && break
              sleep 5
            done
            if [ "$status" != healthy ]; then
              echo "postiz is $status after 8 minutes"
              docker compose logs --tail 100 postiz
              exit 1
            fi

            docker image prune -f
